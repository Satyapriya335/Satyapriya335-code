[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handwritten-recognition-system"
version = "1.0.0"
description = "End-to-end Handwritten Digit and Character Recognition System with preprocessing, segmentation, CNN classification, and automated form processing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "datasets>=2.18",
    "pyarrow>=15.0",
    "huggingface-hub>=0.22",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
hdr = "hdr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
